

name: Build StrengthSMP

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrengthSMP-GitHub-Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o StrengthSMP-GitHub-Build.zip -d source
          find source -name pom.xml -print

      - name: Build plugin
        run: |
          POM=$(find source -name pom.xml -print -quit)
          test -n "$POM" || { echo "pom.xml tidak ditemukan"; exit 1; }
          cd "$(dirname "$POM")"
          mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-JAR
          path: source/**/target/*.jar
          if-no-files-found: error
