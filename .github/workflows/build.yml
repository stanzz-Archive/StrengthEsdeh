
name: Build StrengthSMP

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrengthSMP-GitHub-Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o StrengthSMP-GitHub-Build.zip -d project
          find project -name pom.xml

      - name: Build plugin
        run: |
          POM="$(find project -name pom.xml | head -n 1)"
          test -n "$POM"
          cd "$(dirname "$POM")"
          mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-JAR
          path: project/**/target/*.jar
