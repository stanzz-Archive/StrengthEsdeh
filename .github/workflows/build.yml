


name: Build StrengthSMP

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrengthSMP-GitHub-Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o StrengthSMP-GitHub-Build.zip -d source

      - name: Find Maven project
        id: project
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan dalam ZIP!"
            exit 1
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Build plugin with Maven
        run: |
          cd "$(dirname "${{ steps.project.outputs.pom }}")"
          mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-JAR
          path: source/**/target/*.jar
          if-no-files-found: error
